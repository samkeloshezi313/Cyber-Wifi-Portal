<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f182e"/>
      <stop offset="100%" stop-color="#070a14"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cyberpunk frame -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#cyberGrad)" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Corner accents -->
  <path d="M6 16 V8 H14" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M50 8 H58 V16" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M6 48 V56 H14" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M50 56 H58 V48" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wi-Fi Signals -->
  <!-- Wave 1 (Outer) -->
  <path d="M14 23 C24 14, 40 14, 50 23" stroke="url(#cyberGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Wave 2 (Mid) -->
  <path d="M21 31 C27 25, 37 25, 43 31" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  <!-- Wave 3 (Inner) -->
  <path d="M28 39 C30 36.5, 34 36.5, 36 39" stroke="#00ffaa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Core Node -->
  <circle cx="32" cy="47" r="3.5" fill="#00ffaa" filter="url(#neonGlow)"/>
</svg>
