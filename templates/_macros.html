{% macro logo(size="") %}
<i class="brand-mark {{ size }}" aria-hidden="true">{{ institution[0] }}</i>
{% endmacro %}

{% macro steps(current, title, total=5) %}
<div class="step-container">
  <div class="steps" aria-hidden="true">
    {% for i in range(1, total + 1) %}
      <span class="{{ 'on' if i <= current else '' }}"></span>
    {% endfor %}
  </div>
  <div class="badge">
    <em></em> <span>PHASE {{ current }}/{{ total }}: {{ title }}</span>
  </div>
</div>
{% endmacro %}
