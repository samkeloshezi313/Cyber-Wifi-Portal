{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
{{ ui.steps(1, "Password Recovery") }}

<div class="signal-icon" aria-hidden="true">
  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
</div>

<h1 class="page-heading">Password Recovery</h1>
<p class="page-copy">Enter your student/staff number or email to receive a verification code for password reset.</p>

<form method="post" action="{{ url_for('forgot_password') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="form-group">
    <label for="identifier">User Identifier / Email</label>
    <input id="identifier" name="identifier" required autocomplete="username" placeholder="user@network.local or ST123456">
  </div>
  <button type="submit" class="button">Send Recovery Code</button>
  <div class="foot">
    <a href="{{ url_for('login') }}">Back to Sign In</a>
    <span style="font-family: var(--mono-font); font-size: .76rem; color: var(--muted);">OTP Protected</span>
  </div>
</form>
{% endblock %}
